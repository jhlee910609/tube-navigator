<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter Controller</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <h2 id="video-title">Loading...</h2>
      <p id="chapter-title">Waiting for video...</p>
      
      <div class="controls">
        <button id="prev-btn" aria-label="Previous Chapter" disabled>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12l13-7v5.2l3-4.2v12l-3-4.2V19L5 12z" fill="currentColor"/>
          </svg>
        </button>
        <button id="next-btn" aria-label="Next Chapter" disabled>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12L6 19v-5.2l-3 4.2V6l3 4.2V5l13 7z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
